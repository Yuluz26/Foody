<!doctype html>
<html lang="ms">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#efe7d7" />
        <title>Tiada sambungan | Foody</title>
        <style>
            html, body { height: 100%; }
            body {
                margin: 0;
                display: grid;
                place-items: center;
                background: #efe7d7;
                color: #211d17;
                font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
                padding: 24px;
            }
            .card {
                width: 100%;
                max-width: 22rem;
                border-radius: 24px;
                background: #efe7d7;
                box-shadow: 10px 10px 22px rgba(158, 133, 88, 0.42), -10px -10px 22px rgba(255, 253, 246, 0.95);
                overflow: hidden;
            }
            .lamp {
                margin: 20px 20px 0;
                border-radius: 10px;
                background: #211d17;
                padding: 20px;
                text-align: center;
            }
            .lamp span {
                font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
                font-weight: 600;
                font-size: 3rem;
                color: #ff9f3d;
                letter-spacing: 0.02em;
            }
            .body { padding: 24px 28px 28px; text-align: center; }
            h1 { margin: 0 0 8px; font-size: 1.5rem; font-weight: 800; }
            p { margin: 0; color: #4f493b; line-height: 1.5; }
            button {
                margin-top: 20px;
                height: 48px;
                width: 100%;
                border: 0;
                border-radius: 16px;
                background: linear-gradient(150deg, #403a31, #1d1a15);
                box-shadow: 6px 6px 13px rgba(158, 133, 88, 0.42), -6px -6px 13px rgba(255, 253, 246, 0.95);
                color: #fff;
                font-weight: 600;
                font-size: 15px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="lamp" aria-hidden="true"><span>--</span></div>
            <div class="body">
                <h1>Tiada sambungan internet</h1>
                <p>Halaman ini belum dimuatkan lagi semasa anda online. Sambung semula internet dan cuba lagi.</p>
                <button type="button" onclick="location.reload()">Cuba lagi</button>
            </div>
        </div>
    </body>
</html>
